name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint (ruff)
    # Ruff nur als Prüfwerkzeug in CI; der Loop selbst braucht weiter nur die Standardbibliothek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Ruff
        run: |
          python -m pip install ruff==0.16.9
          ruff check .
          ruff format --check .

  unittest:
    name: unittest (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: python -m py_compile loop.py mcp_server.py && python -m compileall -q claudegravity
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  sandbox:
    name: sandbox (docker)
    # Prüfbefehl und CLI-Bauleiter wirklich im Container; dazu das mitgelieferte Image mit den KI-CLIs bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Sandbox-Tests mit Docker
        env:
          CLAUDEGRAVITY_TEST_SANDBOX: "1"
        run: python -m unittest tests.test_sandbox -v
      - name: Image sandbox/Dockerfile
        run: |
          docker build -t claudegravity-sandbox sandbox/
          docker run --rm --user 1001:1001 -e HOME=/tmp claudegravity-sandbox sh -c 'claude --version && codex --version && gemini --version && copilot --version && python -m pytest --version && git --version'

  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.strategy }})
    # Ganzer Ablauf (Plan, Review, Bau, Prüfbefehl, Abnahme) mit einem Fake-Server statt KI-Abos
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        strategy: [balanced, local-free]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Smoke run (${{ matrix.strategy }})
        run: python tests/smoke/run_smoke.py --strategy ${{ matrix.strategy }} --out smoke-artifacts
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}-${{ matrix.strategy }}
          path: smoke-artifacts/
          if-no-files-found: warn

  mcpb:
    name: mcpb (Claude-Desktop-Erweiterung)
    # Manifest mit dem offiziellen Werkzeug prüfen, Bundle bauen und als Artefakt ablegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Manifest prüfen
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
      - name: Bundle bauen
        run: |
          python tools/build_mcpb.py
          npx -y @anthropic-ai/mcpb@2.1.2 info dist/claudegravity-*.mcpb
      - uses: actions/upload-artifact@v7
        with:
          name: claudegravity-mcpb
          path: dist/*.mcpb

  manifests:
    name: manifests (JSON/TOML, MCP handshake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Parse JSON and TOML manifests
        run: |
          python - <<'PY'
          import json, sys, tomllib
          from pathlib import Path
          files = ["plugin.json", "mcp.json", "mcp_config.json", "gemini-extension.json",
                   ".claude-plugin/plugin.json", ".claude-plugin/marketplace.json",
                   ".cursor-plugin/plugin.json", ".cursor-plugin/mcp.json",
                   ".cursor-plugin/marketplace.json", ".vscode/mcp.json"]
          bad = 0
          for name in files:
              try:
                  json.loads(Path(name).read_text(encoding="utf-8"))
              except Exception as exc:
                  bad += 1
                  print(f"::error file={name}::invalid JSON: {exc}")
          for path in sorted(Path("commands/claudegravity").glob("*.toml")):
              try:
                  tomllib.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad += 1
                  print(f"::error file={path}::invalid TOML: {exc}")
          sys.exit(1 if bad else 0)
          PY
      - name: Plugin and MCP tests (incl. handshake)
        run: python -m unittest tests.test_plugins tests.test_mcp_server -v

  installer:
    name: installer smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Isoliertes Home-Verzeichnis, damit der Runner nicht verändert wird; --dry-run schreibt nichts
      - name: Prepare isolated home
        shell: python
        run: |
          import os, tempfile
          home = tempfile.mkdtemp(prefix="cg-home-")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"HOME={home}\nUSERPROFILE={home}\n")
      - name: install.py --dry-run
        run: python install.py --dry-run --all-clients
      - name: install.py --status
        run: python install.py --status
      - name: install.sh --dry-run
        if: runner.os != 'Windows'
        run: sh ./install.sh --dry-run --all-clients
      - name: install.ps1 --dry-run
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 --dry-run --all-clients
      - name: install.bat --dry-run
        if: runner.os == 'Windows'
        shell: cmd
        run: install.bat --dry-run --all-clients

  package:
    name: package (${{ matrix.os }}, py${{ matrix.python }})
    # pip install . in eine frische Umgebung, dann die Befehle aus einem fremden Ordner aufrufen (wie pipx/uv tool)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install into a fresh venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cg-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$RUNNER_TEMP/cg-venv/Scripts"; else BIN="$RUNNER_TEMP/cg-venv/bin"; fi
          "$BIN/python" -m pip install --quiet .
          echo "$BIN" >> "$GITHUB_PATH"
      - name: Commands work outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          claudegravity --version
          claudegravity-loop --lang en --help > /dev/null
          python -m claudegravity --version
          mkdir -p demo && cd demo
          claudegravity --dry-run "Demo" --endpoint http://127.0.0.1:9/v1 --no-guide > /dev/null
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | claudegravity-mcp | grep '"serverInfo"' > /dev/null
