name: release

# Ein Versions-Tag (git tag v1.6.0 && git push origin v1.6.0) baut die fertigen Programme für Linux, macOS und
# Windows, die Claude-Desktop-Erweiterung und das Python-Paket, prüft alles und veröffentlicht es als GitHub-Release.
# "Run workflow" (workflow_dispatch) baut und prüft dasselbe als Probelauf, ohne etwas zu veröffentlichen.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  program:
    name: program (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux auf Ubuntu 22.04 gebaut, damit es auch mit älterem glibc (2.35) läuft, z. B. Raspberry Pi OS 12
          - { os: ubuntu-22.04, target: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Programm bauen und prüfen
        run: |
          python -m pip install pyinstaller==6.22.3
          python tools/build_standalone.py --expect ${{ matrix.target }}
      - name: Ein-Befehl-Installation (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          h="$RUNNER_TEMP/home"
          mkdir -p "$h/.claude" "$h/.codex"
          HOME="$h" CLAUDEGRAVITY_ARCHIVE="dist/claudegravity-${{ matrix.target }}.tar.gz" sh tools/release/claudegravity-install.sh --no-path
          HOME="$h" "$h/.local/bin/claudegravity-loop" --version
          grep -q '"mcp"' "$h/.codex/config.toml"
          python tools/build_standalone.py --smoke "$h/.local/bin/claudegravity"
          HOME="$h" "$h/.local/bin/claudegravity" install --uninstall
          test ! -e "$h/.local/bin/claudegravity"
      - name: Ein-Befehl-Installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force (Join-Path $h '.codex') | Out-Null
          $env:USERPROFILE = $h
          $env:APPDATA = Join-Path $h 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $h 'AppData\Local'
          ./tools/release/claudegravity-install.ps1 -Archive dist/claudegravity-windows-x86_64.zip -InstallArgs '--no-path'
          $exe = Join-Path $env:LOCALAPPDATA 'ClaudeGravity\bin\claudegravity.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & (Join-Path $env:LOCALAPPDATA 'ClaudeGravity\bin\claudegravity-mcp.cmd') --info
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Quiet -Pattern '"mcp"' -Path (Join-Path $h '.codex\config.toml'))) { exit 1 }
          python tools/build_standalone.py --smoke $exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: program-${{ matrix.target }}
          path: dist/claudegravity-${{ matrix.target }}.*
          if-no-files-found: error

  python:
    name: Python-Paket und Claude-Desktop-Erweiterung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag passt zur Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release.py --check "$GITHUB_REF_NAME"
      - name: Wheel und sdist
        run: |
          python -m pip install build==1.6.1
          python -m build --outdir dist
      - name: Claude-Desktop-Erweiterung
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
          python tools/build_mcpb.py --out mcpb-dist
          mv mcpb-dist/claudegravity-*.mcpb dist/claudegravity.mcpb
          npx -y @anthropic-ai/mcpb@2.1.2 info dist/claudegravity.mcpb
      - name: Wheel installiert sich und startet
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/claudegravity" --version
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub-Release veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [program, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Installer, Prüfsummen und Notizen
        run: python tools/release.py "$GITHUB_REF_NAME" dist --notes "$RUNNER_TEMP/release-notes.md"
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "ClaudeGravity Loop $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
